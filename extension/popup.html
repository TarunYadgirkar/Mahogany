<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mahogany</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        background: #17110f;
        color: #e8ddd4;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      h1 {
        font-size: 10.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #c4703f;
        margin: 0 0 10px;
      }
      textarea,
      input {
        width: 100%;
        box-sizing: border-box;
        background: #241b17;
        border: 1px solid #3b2b24;
        border-radius: 7px;
        padding: 8px 10px;
        color: #e8ddd4;
        font: inherit;
        margin-bottom: 8px;
      }
      textarea {
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      button {
        flex: 1;
        border: none;
        border-radius: 7px;
        padding: 9px 0;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: #c4703f;
        color: #17110f;
      }
      button.secondary {
        background: transparent;
        border: 1px solid #3b2b24;
        color: #e8ddd4;
        font-weight: 400;
      }
      button:disabled {
        background: #4a3529;
        color: #8a7568;
        cursor: not-allowed;
      }
      #out {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #3b2b24;
        font-size: 13.5px;
      }
      #meta {
        color: #a89486;
        font-size: 12px;
        margin-top: 6px;
      }
      #err {
        color: #d9776a;
        font-size: 12.5px;
        margin-top: 8px;
      }
      details {
        margin-top: 10px;
        font-size: 12.5px;
        color: #a89486;
      }
      summary {
        cursor: pointer;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Mahogany</h1>
    <textarea id="question" rows="3" placeholder="Select text on the page, or type a side question."></textarea>
    <div class="row">
      <button id="fork">Fork</button>
      <button id="merge" class="secondary">Merge</button>
    </div>
    <div id="out" class="hidden">
      <div id="speak"></div>
      <div id="meta"></div>
    </div>
    <div id="err" class="hidden"></div>
    <details>
      <summary>Settings</summary>
      <input id="baseUrl" type="url" placeholder="https://your-app.vercel.app" />
      <input id="secret" type="password" placeholder="TOOL_SECRET" />
      <input id="session" type="text" placeholder="session id" />
      <button id="save" class="secondary">Save</button>
    </details>
    <script type="module" src="popup.js"></script>
  </body>
</html>
